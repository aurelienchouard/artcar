# Art Car Studio on the camp Pi: http://aurora.brc/artcar/
# Answers only for the aurora.brc name, so anything else already on port 80 keeps working.
server {
    listen 80;
    server_name aurora.brc;

    location = /artcar { return 301 /artcar/; }
    location /artcar/ {
        alias /var/www/artcar/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    # Free for later, e.g. the Aurora power dashboard at http://aurora.brc/
    location = / { return 302 /artcar/; }
}
